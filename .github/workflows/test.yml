name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      # pip installs into the system interpreter are rejected on modern
      # Ubuntu (PEP 668); pip-based tools go into this venv instead.
      - name: Set up Python venv for pip-installed tools
        run: |
          python3 -m venv "$HOME/.venv"
          echo "$HOME/.venv/bin" >> "$GITHUB_PATH"

      # The runner's system gem directory is root-owned; give gem installs
      # a user-writable home.
      - name: Set up user gem home for gem-installed tools
        run: |
          echo "GEM_HOME=$HOME/.gem" >> "$GITHUB_ENV"
          echo "$HOME/.gem/bin" >> "$GITHUB_PATH"

      # Some npm packages (jslint) symlink man pages into root-owned
      # /usr/local/share; route npm -g installs to a user-writable prefix.
      - name: Set up user npm prefix for npm-installed tools
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      # Registry-driven: install every tool rsconstruct knows about, so a
      # new processor's tool is covered without touching this workflow.
      # Skipped: entries with a manual-only install method (checkpatch.pl)
      # and entries named by project-local paths (node_modules/.bin/...,
      # gems/bin/...) — their installed-flag can never turn true here.
      - name: Install all registry tools
        run: |
          set -euo pipefail
          missing="$(./target/debug/rsconstruct tools list --json \
            | jq -r '.[] | select(.installed | not)
                     | select(.install_methods[0].method != "manual")
                     | select(.tool | contains("/") | not)
                     | .tool')"
          echo "Tools to install:"
          echo "$missing"
          for tool in $missing; do
            ./target/debug/rsconstruct tools install -y "$tool"
          done

      # markdownlint is probed by bare name in tests but its registry entry
      # is the project-local path node_modules/.bin/markdownlint, so the
      # loop above cannot cover it.
      - name: Install system markdownlint
        run: npm install -g markdownlint-cli

      # The suite hard-fails on any missing tool (tests never skip), so a
      # gap in the matrix fails the run loudly instead of shrinking it.
      - name: Run tests
        run: cargo test
